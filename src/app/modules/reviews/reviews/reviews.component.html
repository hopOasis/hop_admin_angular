<table mat-table [dataSource]="reviews" class="mat-elevation-z8" *ngIf="reviews.length > 0">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let review">{{ review.id }}</td>
    </ng-container>
  
    <ng-container matColumnDef="user">
      <th mat-header-cell *matHeaderCellDef>User</th>
      <td mat-cell *matCellDef="let review">{{ review.firstName }} <br> {{ review.lastName }} <br> {{ review.userId }} </td>
    </ng-container>
    
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let review">{{ review.createdAt }}</td>
    </ng-container>

    <ng-container matColumnDef="content">
      <th mat-header-cell *matHeaderCellDef>Review</th>
      <td mat-cell *matCellDef="let review">
        <span *ngIf="review.content?.length <= 100"> img {{review.itemId}} <br> </span>
        {{ review.content }}
      </td>
    </ng-container>
  
  
    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let review">
            <button mat-icon-button color="primary" (click)="onMoreInfo(review.id)">
              <mat-icon>more_horiz</mat-icon>
            </button>
          <button mat-icon-button color="warn" (click)="onDeleteReview(review.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
