<mat-form-field>
  <input
    matInput
    [(ngModel)]="searchText"
    (input)="applyFilters()"
    placeholder="Введіть ID або ключове слово"
  />
</mat-form-field>

<table
  mat-table
  [dataSource]="filteredReviews"
  class="mat-elevation-z8"
  *ngIf="filteredReviews.length > 0"
>
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let review">{{ review.id }}</td>
  </ng-container>

  <ng-container matColumnDef="user">
    <th mat-header-cell *matHeaderCellDef>Користувач</th>
    <td mat-cell *matCellDef="let review">
      <span>{{ review.firstName }} {{ review.lastName }}</span>
      <br />
      <small>ID: {{ review.userId }}</small>
    </td>
  </ng-container>

  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Дата</th>
    <td mat-cell *matCellDef="let review">
      {{ review.createdAt | date : "dd.MM.yyyy HH:mm" }}
    </td>
  </ng-container>

  <ng-container matColumnDef="content">
    <th mat-header-cell *matHeaderCellDef>Відгук</th>
    <td mat-cell *matCellDef="let review">
      <span
        *ngIf="review.content?.length > 100"
        matTooltip="{{ review.content }}"
      >
        {{ review.content | slice : 0 : 100 }}...
      </span>
      <span *ngIf="review.content?.length <= 100">
        {{ review.content }}
      </span>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Дії</th>
    <td mat-cell *matCellDef="let review">
      <button
        mat-icon-button
        color="warn"
        (click)="onDeleteReview(review.id)"
        aria-label="Видалити"
      >
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<div *ngIf="filteredReviews.length === 0" class="no-reviews">
  Немає відгуків
</div>
